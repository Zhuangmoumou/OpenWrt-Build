name: Build Armbian

on:
  workflow_dispatch:
    inputs:
      RELEASE:
        type: choice
        description: '选择发行版'
        required: true
        default: 'noble'  # 默认值
        options:
          - resolute  # Ubuntu 26.04
          - questing  # Ubuntu 25.10
          - plucky    # Ubuntu 25.04
          - oracular  # Ubuntu 24.10
          - noble     # Ubuntu 24.04
          - jammy     # Ubuntu 22.04 LTS
          - bookworm  # Debian 12
          - bullseye  # Debian 11
          - sid       # Debian unstable
          - trixie    # Debian Trixe

      armbian_mini:
        type: choice
        description: '是否选择minimal版(no/yes)'
        required: true
        default: 'no'
        options:
          - no
          - yes      armbian_mini:
        type: choice
        description: '是否选择minimal版(no/yes)'
        required: true
        default: 'no'
        options:
          - no
          - yes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    # 初始化环境
    - name: Initialization environment
      id: init
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo systemctl is-active docker || sudo systemctl start docker
        docker rmi $(docker images -q) 2>/dev/null || true
        [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
        #sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null
        #sudo swapoff -a
        #sudo rm -f /swapfile /mnt/swapfile
        sudo -E apt-get -y update
        #sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
        #sudo -E apt-get -y install $(curl -fsSL https://is.gd/depend_ubuntu2204_armbian)
        sudo -E systemctl daemon-reload
        sudo -E apt-get -y full-upgrade
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean
        #sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        #sudo rm -rf ~/{.cargo,.dotnet,.rustup}
        sudo -E timedatectl set-timezone "Asia/Shanghai"
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: Create simulated physical disk
      run: |
        set -e

        sudo apt-get update
        sudo apt-get install -y lvm2 xfsprogs

        # 获取 /mnt 和 / 的可用空间，单位 GB
        mnt_avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc '0-9')
        root_avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')

        mnt_size=$((mnt_avail - 1))
        root_size=$((root_avail - 4))

        if [ "$mnt_size" -le 1 ]; then
          echo "/mnt 可用空间不足"
          df -hT
          exit 1
        fi

        if [ "$root_size" -le 1 ]; then
          echo "/ 可用空间不足"
          df -hT
          exit 1
        fi

        sudo truncate -s "${mnt_size}G" /mnt/mnt.img
        sudo truncate -s "${root_size}G" /root.img

        # 自动分配空闲 loop 设备，不要固定 /dev/loop6 /dev/loop7
        LOOP_MNT=$(sudo losetup --find --show /mnt/mnt.img)
        LOOP_ROOT=$(sudo losetup --find --show /root.img)

        echo "LOOP_MNT=${LOOP_MNT}"
        echo "LOOP_ROOT=${LOOP_ROOT}"

        sudo pvcreate "${LOOP_MNT}"
        sudo pvcreate "${LOOP_ROOT}"

        sudo vgcreate github "${LOOP_MNT}" "${LOOP_ROOT}"
        sudo lvcreate -n runner -l 100%FREE github

        sudo mkfs.xfs -f /dev/github/runner
        sudo mkdir -p /builder
        sudo mount /dev/github/runner /builder
        sudo chown -R runner:runner /builder

        df -Th
        sudo losetup -a

    # 检查空间使用情况
    - name: Check space usage
      run: df -hT

    # 克隆源码
    - name: Clone source code
      id: down
      working-directory: /builder
      run: |
        git clone -q --single-branch --depth=1 --branch=main https://github.com/armbian/build.git build
        ln -sf /builder/build ${GITHUB_WORKSPACE}/build
        echo "status=success" >> ${GITHUB_OUTPUT}

    # 开始构建
    - name: Armbian build
      id: compile
      working-directory: /builder
      run: |
        cd build
        ./compile.sh \
          BOARD=hinlink-ht2 \
          BRANCH=vendor \
          KERNEL_TARGET='vendor' \
          RELEASE=${{ github.event.inputs.RELEASE }} \
          BUILD_MINIMAL=${{ github.event.inputs.armbian_mini }} \
          BUILD_DESKTOP=no \
          PREFER_DOCKER=no \
          KERNEL_CONFIGURE=no \
          USE_CONTAINER=no \
          COMPRESS_OUTPUTIMAGE=img

    # 检查空间使用情况
    - name: Check space usage
      run: df -hT

    # 上传构建结果
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Armbian-${{ github.event.inputs.RELEASE }}-${{ github.event.inputs.armbian_mini }}-mini
        path: build/output/images/
