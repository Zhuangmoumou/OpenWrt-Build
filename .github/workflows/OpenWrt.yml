name: Build OpenWrt Firmware

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
      - name: 空间清理和初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间(Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true


      # 克隆源码
      - name: 克隆源码
        id: down
        run: |
          git clone --single-branch --depth=1 --branch=master https://github.com/coolsnowwolf/lede openwrt
          #git clone -b openwrt-24.10 --depth=1 https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt/
          #sed -i 's|src-git luci https://github.com/coolsnowwolf/luci;openwrt-23.05|src-git luci https://github.com/coolsnowwolf/luci|g' feeds.conf.default
          #添加软件包，并在下部更新feeds时删除重复项目
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default
          sed -i '1i src-git kenzo https://github.com/kenzok8/openwrt-packages' feeds.conf.default
          sed -i '2i src-git small https://github.com/kenzok8/small' feeds.conf.default
          echo "status=success" >> ${GITHUB_OUTPUT}

      # 检查空间使用情况
      - name: 检查空间使用情况
        run: df -hT

      # 更新并安装 feeds
      - name: 更新并安装feeds
        id: feeds
        run: |
          cd openwrt/
          ./scripts/feeds update -a && rm -rf feeds/luci/applications/luci-app-mosdns
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/kenzok8/golang -b 1.25 feeds/packages/lang/golang
          ./scripts/feeds install -a

      # 加载根目录下的配置文件
      - name: 加载配置文件
        id: cpconfig
        run: |
          cd openwrt/
          cp "${GITHUB_WORKSPACE}/config" .config
          cp "${GITHUB_WORKSPACE}/diy.sh" diy.sh
          bash diy.sh

      # 下载包
      - name: make下载包
        id: dl
        run: |
          cd openwrt/
          make defconfig
          make download -j16
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

     # 设置缓存
     # - name: Cache build dependencies
     #   uses: actions/cache@v3
     #   with:
     #     path: |
     #       openwrt/tmp          # 临时编译文件目录
     #       openwrt/build_dir    # 编译结果目录
     #       openwrt/staging_dir  # 工具链和临时库
     #       .ccache              # ccache 缓存
     #     key: ${{ runner.os }}-openwrt-cache-${{ hashFiles('**/.config') }}
     #     restore-keys: |
     #       ${{ runner.os }}-openwrt-cache-

      # 编译固件
      - name: 编译OpenWrt
        id: build
        run: |
          cd openwrt/
          echo "========================"
          echo -e "$(nproc) 线程编译"
          echo "========================"
          make -j$(nproc) || make -j1 V=s
          #make V=w -j$(($(nproc) + 1))
          #make -j$(($(nproc) + 1)) V=s 2>&1 | grep -iE "error|warning|fail"
          echo "============检查bin目录============="
          ls -R "${GITHUB_WORKSPACE}/openwrt/bin"
          echo "status=success" >> ${GITHUB_OUTPUT}

      # 检查空间使用情况
      - name: 检查空间使用情况
        run: |
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -sh ./openwrt

      # 上传dl
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: dl
          path: openwrt/dl

      # 上传编译结果
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bin
          path: openwrt/bin
